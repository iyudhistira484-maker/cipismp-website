name: CipiStoreCompanion
version: '${version}'
main: id.cipismp.companion.CipiCompanionPlugin
api-version: '1.21'
authors: [CipiSMP]
description: Companion plugin untuk CipiSMP Store (pengiriman rank/kit dan verifikasi akun).
website: https://cipismp.my.id
softdepend: [LuckPerms, PlayerKits2, LoginSecurity, floodgate]
commands:
  verify:
    description: Hubungkan akun Minecraft-mu dengan CipiSMP Store memakai kode dari dashboard.
    usage: /verify <kode>
    aliases: [verifikasi]
  cipistore:
    description: Perintah admin untuk antrean pengiriman.
    usage: /cipistore <queue|flush|reload>
    aliases: [cis]
    permission: cipismp.admin
permissions:
  cipismp.admin:
    description: Mengelola antrean pengiriman CipiSMP Store.
    default: op
