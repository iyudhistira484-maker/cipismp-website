name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: http://localhost:3000
  SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  EMAIL_PROVIDER: outbox
  PAYMENT_DEFAULT_PROVIDER: FAKE
  MINECRAFT_LOOKUP_MODE: mock
  TURNSTILE_ENABLED: "0"
  CRON_SECRET: ci-cron-secret-0123456789

jobs:
  quality:
    name: Typecheck, unit test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipismp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipismp_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipismp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Terapkan migrasi ke database test
        run: npx drizzle-kit migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration test
        run: npm test
      - name: Build produksi
        run: npm run build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipismp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipismp
      OWNER_EMAIL: owner@cipismp.test
      OWNER_USERNAME: owner
      OWNER_PASSWORD: OwnerPassword123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx drizzle-kit migrate
      - run: npm run db:seed
      - name: Pasang browser Playwright
        id: pwinstall
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee playwright-install.log
      - name: Laporkan error instalasi browser (annotation)
        if: steps.pwinstall.outcome == 'failure'
        run: |
          tail -n 10 playwright-install.log | awk '{ print "::error::" $0 }'
      # Instalasi browser gagal tidak memblokir job; kegagalan nyata akan muncul di test:e2e.

      - run: npm run build
      - name: Jalankan e2e
        id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
        env:
          CI: "true"
      - name: Laporkan kegagalan e2e (annotation)
        if: steps.e2e.outcome == 'failure'
        run: |
          tail -n 12 e2e.log | awk '{ print "::error::" $0 }'
      - name: Gagal bila e2e error
        if: steps.e2e.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-install-log
          path: playwright-install.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  plugin:
    name: Plugin Paper (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Kompilasi plugin
        id: build
        continue-on-error: true
        working-directory: plugin
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/plugin-build.log"
      - name: Laporkan error kompilasi (annotation)
        if: steps.build.outcome == 'failure'
        run: |
          grep -nE "error:|What went wrong|Execution failed|Could not resolve|FAILURE" plugin-build.log \
            | tail -n 10 \
            | awk '{ print "::error::" $0 }'
          if [ ! -s plugin-build.log ]; then echo "::error::log kompilasi kosong"; fi
      - name: Gagal bila kompilasi error
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Simpan JAR
        uses: actions/upload-artifact@v4
        with:
          name: cipismp-companion-jar
          path: plugin/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image & compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Siapkan .env dari contoh
        run: cp .env.example .env
      - name: Validasi docker-compose.yml
        id: compose
        continue-on-error: true
        run: |
          set -o pipefail
          docker compose config 2>&1 | tee compose-config.log
      - name: Laporkan error compose (annotation)
        if: steps.compose.outcome == 'failure'
        run: |
          tail -n 6 compose-config.log | awk '{ print "::error::" $0 }'
      - name: Gagal bila compose tidak valid
        if: steps.compose.outcome == 'failure'
        run: exit 1
      - name: Build image produksi
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cipismp-store:ci
