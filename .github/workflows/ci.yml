name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: http://localhost:3000
  SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  EMAIL_PROVIDER: outbox
  PAYMENT_DEFAULT_PROVIDER: FAKE
  MINECRAFT_LOOKUP_MODE: mock
  TURNSTILE_ENABLED: "0"
  CRON_SECRET: ci-cron-secret-0123456789

jobs:
  quality:
    name: Typecheck, unit test, build
    # Runner 24.04 dipakai eksplisit: ubuntu-latest sudah mulai pindah ke 26.04,
    # yang belum didukung Playwright maupun Postgres service image tertentu.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipismp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipismp_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipismp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Terapkan migrasi ke database test
        run: npx drizzle-kit migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration test
        run: npm test
      - name: Build produksi
        run: npm run build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-24.04
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipismp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipismp
      APP_URL: http://127.0.0.1:3100
      E2E_PORT: "3100"
      E2E_ALLOW_DB_FIXTURES: "1"
      # Fake credentials only make the sandbox checkout form available in this isolated job.
      # These are not valid gateway credentials; no real transaction is made by the tests.
      E2E_REQUIRE_CHECKOUT: "1"
      MIDTRANS_SERVER_KEY: "invalid-ci-test-key-not-a-credential"
      MIDTRANS_MODE: sandbox
      SEED_OWNER_EMAIL: owner@cipismp.test
      SEED_OWNER_USERNAME: owner
      SEED_OWNER_PASSWORD: OwnerPassword123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx drizzle-kit migrate
      - run: npm run db:seed
      - name: Pasang browser Playwright
        id: pwinstall
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright install chromium 2>&1 | tee playwright-install.log
      - name: Dependensi sistem untuk Chromium
        id: pwdeps
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright install-deps chromium 2>&1 | tee playwright-deps.log
      - name: Laporkan error instalasi browser (annotation)
        if: steps.pwinstall.outcome == 'failure' || steps.pwdeps.outcome == 'failure'
        run: |
          tail -n 8 playwright-install.log | awk '{ print "::error::" $0 }'
          tail -n 8 playwright-deps.log 2>/dev/null | awk '{ print "::error::" $0 }'
      - name: Hentikan bila browser tidak terpasang
        if: steps.pwinstall.outcome == 'failure'
        run: exit 1

      - run: npm run build
      - name: Jalankan e2e
        id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
        env:
          CI: "true"
      - name: Laporkan kegagalan e2e (annotation)
        if: steps.e2e.outcome == 'failure'
        run: |
          grep -n -A4 "Error:" e2e.log | head -n 20 | awk '{ print "::error::" $0 }'
          grep -nE "webServer|Timed out|ECONNREFUSED|net::" e2e.log | head -n 6 | awk '{ print "::error::" $0 }'
      - name: Gagal bila e2e error
        if: steps.e2e.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-install-log
          path: playwright-install.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-diagnostics
          path: |
            e2e.log
            test-results
          if-no-files-found: ignore
          retention-days: 7

  plugin:
    name: Plugin Paper ${{ matrix.paper }} (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: "1.21.4"
            java: "21"
            gradle: "8.10.2"
          - paper: "26.1.2"
            java: "25"
            gradle: "9.2.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Kompilasi plugin
        id: build
        continue-on-error: true
        working-directory: plugin
        run: |
          set -o pipefail
          gradle build -PpaperTarget=${{ matrix.paper }} --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/plugin-build.log"
      - name: Laporkan error kompilasi (annotation)
        if: steps.build.outcome == 'failure'
        run: |
          grep -n -A6 "Could not resolve io.papermc" plugin-build.log | tail -n 10 | awk '{ print "::error::" $0 }'
          grep -n "error:" plugin-build.log | head -n 8 | awk '{ print "::error::" $0 }'
          if [ ! -s plugin-build.log ]; then echo "::error::log kompilasi kosong"; fi
      - name: Gagal bila kompilasi error
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Hitung checksum JAR
        working-directory: plugin/build/libs
        run: |
          set -euo pipefail
          for jar in *.jar; do sha256sum "$jar" > "$jar.sha256"; done
      - name: Simpan JAR dan checksum
        uses: actions/upload-artifact@v4
        with:
          name: cipismp-companion-paper-${{ matrix.paper }}
          path: |
            plugin/build/libs/*.jar
            plugin/build/libs/*.sha256
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image & compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Siapkan .env dari contoh
        run: cp .env.example .env
      - name: Validasi docker-compose.yml
        id: compose
        env:
          POSTGRES_PASSWORD: ci-compose-test-only
        continue-on-error: true
        run: |
          set -o pipefail
          docker compose config 2>&1 | tee compose-config.log
      - name: Laporkan error compose (annotation)
        if: steps.compose.outcome == 'failure'
        run: |
          tail -n 6 compose-config.log | awk '{ print "::error::" $0 }'
      - name: Gagal bila compose tidak valid
        if: steps.compose.outcome == 'failure'
        run: exit 1
      - name: Build image produksi
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cipismp-store:ci
